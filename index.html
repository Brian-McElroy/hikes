<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikes</title>
<style>
  :root {
    --bg: #111;
    --fg: #eee;
    --gap: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  section {
    padding: 8px 0 12px;
  }
  h2 {
    margin: 0;
    padding: 16px 20px 0;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--gap);
    padding: 20px;
  }
  .grid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    display: block;
    background: #222;
    transition: transform 0.15s ease;
  }
  .grid img:hover {
    transform: scale(1.03);
  }
  .missing {
    padding: 40px 20px;
    color: #999;
    line-height: 1.6;
  }
  .missing code {
    background: #222;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open {
    display: flex;
  }
  .lightbox img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  .lb-btn {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 15%;
    background: none;
    border: none;
    color: #fff;
    font-size: 2.5rem;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s ease;
    z-index: 2;
  }
  .lb-btn:hover { opacity: 1; }
  .lb-prev { left: 0; }
  .lb-next { right: 0; }
  .lb-close {
    position: absolute;
    top: 0;
    right: 0;
    bottom: auto;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    opacity: 0.9;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="hikes"></div>

<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" id="lbClose">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev">&#10094;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext">&#10095;</button>
</div>

<script src="photos_list.js"></script>
<script>
const hikesEl = document.getElementById('hikes');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
let currentHike = 0;
let currentPhoto = 0;

if (hikes.length === 0) {
  hikesEl.innerHTML = `
    <div class="missing">
      No hikes listed yet. Open <code>index.html</code>, find the
      <code>hikes</code> list near the bottom of the script, and add
      an entry for each folder of photos, e.g.
      <code>{ title: "Slieve Donard", photos: [{ full: "Slieve Donard/1.jpg", thumb: "Slieve Donard/thumbs/1.jpg" }] }</code>.
    </div>
  `;
} else {
  hikes.forEach((hike, hIndex) => {
    const section = document.createElement('section');

    const h2 = document.createElement('h2');
    h2.textContent = hike.title;
    section.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';
    hike.photos.forEach((photo, pIndex) => {
      const img = document.createElement('img');
      img.src = photo.thumb;
      img.loading = 'lazy';
      img.alt = hike.title;
      img.addEventListener('click', () => openLightbox(hIndex, pIndex));
      grid.appendChild(img);
    });
    section.appendChild(grid);

    hikesEl.appendChild(section);
  });
}

function openLightbox(hIndex, pIndex) {
  currentHike = hIndex;
  currentPhoto = pIndex;
  showPhoto();
  lightbox.classList.add('open');
}

function showPhoto() {
  lbImg.src = hikes[currentHike].photos[currentPhoto].full;
}

function next() {
  const photos = hikes[currentHike].photos;
  currentPhoto = (currentPhoto + 1) % photos.length;
  showPhoto();
}

function prev() {
  const photos = hikes[currentHike].photos;
  currentPhoto = (currentPhoto - 1 + photos.length) % photos.length;
  showPhoto();
}

function closeLightbox() {
  lightbox.classList.remove('open');
}

document.getElementById('lbNext').addEventListener('click', next);
document.getElementById('lbPrev').addEventListener('click', prev);
document.getElementById('lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'Escape') closeLightbox();
});
</script>

</body>
</html>
